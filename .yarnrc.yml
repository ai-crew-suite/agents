    "@material-ui/icons": "^4.11.3"     # Legacy icons wrapper
    "@mui/material": "^5.18.0"          # Pinned to v5 in v1.53.1 framework
    "@mui/icons-material": "^5.18.0"    # Pinned to v5 in v1.53.1 framework
    "@rjsf/utils": "^5.24.13"           # Pinned to v5 in v1.53.1 framework
    "better-sqlite3": "^9.11.0"
    "eventsource-parser": "^2.0.1"      # Pinned to v2 in v1.53.1 framework
    "i18next": "^23.11.5"
    "pg": "^8.12.0"
    "prop-types": "^15.8.1"
    "react": "^18.3.1"                  # Pinned to v18 in v1.53.1 framework
    "react-dom": "^18.3.1"              # Pinned to v18 in v1.53.1 framework
    "react-router-dom": "^6.23.1"       # Pinned to v6 in v1.53.1 framework
    "react-router": "^6.30.6"           # Pinned to v6 in v1.53.1 framework

  # Development/Tooling dependencies. Upgrades here do NOT trigger downstream
  # package releases.
  dev:
    "@changesets/cli": "^3.0.3"
    "@playwright/test": "^1.44.1"
    "@testing-library/dom": "^10.1.0"
    "@testing-library/jest-dom": "^7.0.1"
    "@testing-library/react": "^16.3.3"
    "@testing-library/user-event": "^14.5.2"
    "@tsconfig/node22": "^22.0.0"       # Aligns with Node 22/24 minimum configurations
    "@types/node": "^22.20.4"           # Aligns with Node 22/24 minimum configurations
    "@types/react": "^18.3.31"          # Pinned to v18 in v1.53.1 framework
    "@types/react-dom": "^18.3.7"       # Pinned to v18 in v1.53.1 framework
    "@typescript-eslint/eslint-plugin": "^8.71.0"
    "@typescript-eslint/parser": "^8.71.0"
    "concurrently": "^10.0.5"
    "eslint": "^10.11.0"
    "husky": "^9.0.11"
    "lint-staged": "^17.6.0"
    "node-actionlint": "^1.1.2"
    "prettier": "^3.2.5"
    "storybook": "^10.6.1"
    "turbo": "^2.11.5"
    "typescript": "^5.9.3"              # Backstage v1.53 uses strict ~5.4 variations
    "vite": "^5.4.21"                   # Pinned to v5 in v1.53.1 framework
    "vitest": "^5.0.3"